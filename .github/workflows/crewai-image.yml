name: Build CrewAI image

on:
  push:
    branches:
      - main
    paths:
      - apps/crewai/**
      - .github/workflows/crewai-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: crewai-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CrewAI
        uses: docker/build-push-action@v6
        with:
          context: apps/crewai
          push: true
          tags: |
            ghcr.io/ergoshear/crewai:latest
            ghcr.io/ergoshear/crewai:${{ github.sha }}
