apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    # Global settings
    global:
      imageRegistry: ""
      imagePullSecrets: []
    
    # Prometheus configuration
    prometheus:
      prometheusSpec:
        replicas: 1
        retention: 10d
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 1000m
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: "standard"
              resources:
                requests:
                  storage: 50Gi
    
    # Grafana configuration
    grafana:
      enabled: true
      adminPassword: "admin"
      persistence:
        enabled: true
        storageClassName: "standard"
        size: 10Gi
      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 1Gi
    
    # Alertmanager configuration
    alertmanager:
      alertmanagerSpec:
        replicas: 1
        retention: 120h
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
    
    # Node exporter configuration
    nodeExporter:
      enabled: true
    
    # kube-state-metrics configuration
    kubeStateMetrics:
      enabled: true
    
    # Prometheus Adapter configuration
    prometheus-adapter:
      enabled: true