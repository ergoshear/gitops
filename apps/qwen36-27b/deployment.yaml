apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen36-27b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen36-27b
  template:
    metadata:
      labels:
        app: qwen36-27b
    spec:
      nodeSelector:
        kubernetes.io/hostname: mlops-node-6.lan
        hardware.gpu: nvidia
      runtimeClassName: nvidia
      initContainers:
      - name: download-model
        image: ghcr.io/ergoshear/qwen36-27b:latest
        imagePullPolicy: Always
        command:
        - /usr/local/bin/download-model
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: llama-server
        image: ghcr.io/ergoshear/qwen36-27b:latest
        imagePullPolicy: Always
        env:
        - name: GPU_LAYERS
          value: "56"
        - name: CTX_SIZE
          value: "262144"
        - name: PARALLEL
          value: "1"
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: "8"
            memory: 24Gi
          limits:
            cpu: "24"
            memory: 56Gi
            nvidia.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: models
          mountPath: /models
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 360
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: qwen36-27b-model
