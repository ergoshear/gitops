apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomic-embed-text
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nomic-embed-text
  template:
    metadata:
      labels:
        app: nomic-embed-text
    spec:
      nodeSelector:
        kubernetes.io/hostname: mlops-node-3.lan
        hardware.gpu: amd
      tolerations:
      - key: dedicated
        operator: Equal
        value: nomic-embed-text
        effect: NoSchedule
      initContainers:
      - name: download-model
        image: ghcr.io/ergoshear/nomic-embed-text:latest
        imagePullPolicy: Always
        command:
        - /usr/local/bin/download-model
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: model-server
        image: ghcr.io/ergoshear/nomic-embed-text:latest
        imagePullPolicy: Always
        env:
        - name: CTX_SIZE
          value: "2048"
        - name: GPU_LAYERS
          value: "99"
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "8"
            memory: 16Gi
            amd.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: Unconfined
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 360
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: nomic-embed-text-model
