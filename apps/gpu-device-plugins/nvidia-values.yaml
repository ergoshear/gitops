---
# NVIDIA device plugin Helm values.
nfd:
  enabled: false

nodeSelector:
  hardware.gpu: nvidia

# K3s registers this runtime when nvidia-container-toolkit is installed.
runtimeClassName: nvidia

tolerations:
  - key: dedicated
    operator: Exists
    effect: NoSchedule

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: hardware.gpu
              operator: In
              values:
                - nvidia
