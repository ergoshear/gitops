apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amd-gpu-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amd-gpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amd-gpu-device-plugin
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        hardware.gpu: amd
      tolerations:
      - key: dedicated
        operator: Equal
        value: qwen3-coder-next
        effect: NoSchedule
      containers:
      - name: amd-gpu-dp-cntr
        image: docker.io/rocm/k8s-device-plugin:1.31.0.10
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        volumeMounts:
        - name: device-plugins
          mountPath: /var/lib/kubelet/device-plugins
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: dev-kfd
          mountPath: /dev/kfd
        - name: dev-dri
          mountPath: /dev/dri
      volumes:
      - name: device-plugins
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: Directory
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: dev-kfd
        hostPath:
          path: /dev/kfd
          type: CharDevice
      - name: dev-dri
        hostPath:
          path: /dev/dri
          type: Directory
