apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fedora-44-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ergoshear/gitops'
    targetRevision: HEAD
    path: fedora-deployment
  destination:
    server: https://kubernetes.default.svc
    namespace: agents
  syncPolicy:
    automated:
      prune: true
      selfHeal: true