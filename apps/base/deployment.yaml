apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedora-44-deployment
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fedora-44
  template:
    metadata:
      labels:
        app: fedora-44
    spec:
      containers:
      - name: fedora-container
        image: fedora:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Fedora 44 deployment running"
          while true; do
            sleep 3600
          done