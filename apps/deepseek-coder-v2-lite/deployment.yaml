apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-coder-v2-lite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deepseek-coder-v2-lite
  template:
    metadata:
      labels:
        app: deepseek-coder-v2-lite
    spec:
      nodeSelector:
        kubernetes.io/hostname: mlops-node-4.lan
        hardware.gpu: amd
      initContainers:
      - name: download-model
        image: ghcr.io/ergoshear/deepseek-coder-v2-lite:latest
        imagePullPolicy: Always
        command:
        - /usr/local/bin/download-model
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: model-server
        image: ghcr.io/ergoshear/deepseek-coder-v2-lite:latest
        imagePullPolicy: Always
        env:
        - name: CTX_SIZE
          value: "128000"
        - name: GPU_LAYERS
          value: "99"
        - name: CACHE_TYPE_K
          value: "q8_0"
        - name: CACHE_TYPE_V
          value: "q8_0"
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
          limits:
            cpu: "24"
            memory: 56Gi
            amd.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: Unconfined
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 360
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: deepseek-coder-v2-lite-model
