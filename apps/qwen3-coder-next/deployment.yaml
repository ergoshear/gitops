apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-coder-next
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-coder-next
  template:
    metadata:
      labels:
        app: qwen3-coder-next
    spec:
      hostIPC: true
      nodeSelector:
        kubernetes.io/hostname: mlops-node-7.lan
        hardware.gpu: amd
      tolerations:
      - key: dedicated
        operator: Equal
        value: qwen3-coder-next
        effect: NoSchedule
      initContainers:
      - name: download-model
        image: ghcr.io/ergoshear/qwen3-coder-next:latest
        imagePullPolicy: Always
        command:
        - /usr/local/bin/download-model
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: llama-server
        image: ghcr.io/ergoshear/qwen3-coder-next:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        resources:
          limits:
            amd.com/gpu: 1
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          seccompProfile:
            type: Unconfined
        volumeMounts:
        - name: models
          mountPath: /models
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 360
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: qwen3-coder-next-model
