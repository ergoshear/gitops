apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-coder-next
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-coder-next
  template:
    metadata:
      labels:
        app: qwen3-coder-next
    spec:
      nodeSelector:
        kubernetes.io/hostname: mlops-node-7.lan
        hardware.gpu: amd
      tolerations:
      - key: dedicated
        operator: Equal
        value: qwen3-coder-next
        effect: NoSchedule
      initContainers:
      - name: download-model
        image: ghcr.io/ergoshear/qwen3-coder-next:latest
        imagePullPolicy: Always
        command:
        - /usr/local/bin/download-model
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: llama-server
        image: ghcr.io/ergoshear/qwen3-coder-next:latest
        imagePullPolicy: Always
        env:
        - name: GPU_LAYERS
          value: "99"
        - name: CTX_SIZE
          value: "65536"
        - name: PARALLEL
          value: "1"
        - name: THREADS
          value: "8"
        - name: BATCH_SIZE
          value: "256"
        - name: UBATCH_SIZE
          value: "128"
        - name: CACHE_TYPE_K
          value: q4_0
        - name: CACHE_TYPE_V
          value: q4_0
        - name: FLASH_ATTN
          value: "on"
        - name: TEMP
          value: "1.0"
        - name: TOP_P
          value: "0.95"
        - name: TOP_K
          value: "40"
        ports:
        - name: http
          containerPort: 8080
        resources:
          limits:
            amd.com/gpu: 1
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          seccompProfile:
            type: Unconfined
        volumeMounts:
        - name: models
          mountPath: /models
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 360
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: qwen3-coder-next-model
