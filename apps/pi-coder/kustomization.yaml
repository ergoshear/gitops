apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
namePrefix: pi-coder-

resources:
- ../base

patches:
- target:
    kind: Deployment
    name: fedora-44-deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/ports
      value:
      - name: cockpit
        containerPort: 9090
        protocol: TCP
    - op: add
      path: /spec/template/spec/containers/0/securityContext
      value:
        privileged: true
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts
      value:
      - name: login
        mountPath: /run/secrets/pi-coder
        readOnly: true
      - name: run
        mountPath: /run
      - name: tmp
        mountPath: /tmp
      - name: cgroup
        mountPath: /sys/fs/cgroup
    - op: add
      path: /spec/template/spec/volumes
      value:
      - name: login
        secret:
          secretName: pi-coder-login
          defaultMode: 0400
          items:
          - key: password
            path: password
      - name: run
        emptyDir:
          medium: Memory
      - name: tmp
        emptyDir:
          medium: Memory
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
    - op: add
      path: /spec/template/spec/containers/0/startupProbe
      value:
        httpGet:
          path: /ping
          port: cockpit
        periodSeconds: 5
        failureThreshold: 30
    - op: add
      path: /spec/template/spec/containers/0/readinessProbe
      value:
        httpGet:
          path: /ping
          port: cockpit
        periodSeconds: 10
    - op: add
      path: /spec/template/spec/containers/0/livenessProbe
      value:
        httpGet:
          path: /ping
          port: cockpit
        periodSeconds: 20
        failureThreshold: 3
- target:
    kind: Service
    name: fedora-44-service
  patch: |-
    - op: replace
      path: /spec/ports
      value:
      - name: cockpit
        port: 9090
        protocol: TCP
        targetPort: cockpit
    - op: replace
      path: /spec/type
      value: ClusterIP

commonLabels:
  agent: pi-coder

images:
- name: ghcr.io/ergoshear/agent
  newName: ghcr.io/ergoshear/pi-coder
  newTag: latest