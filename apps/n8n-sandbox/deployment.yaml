apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-api
  template:
    metadata:
      labels:
        app: sandbox-api
    spec:
      initContainers:
      - name: bootstrap-mtls
        image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.7.0
        imagePullPolicy: IfNotPresent
        command: [sh, -c]
        args:
        - >-
          if [ ! -s /tls/api/grpc-server.crt ] || [ ! -s /tls/runner/grpc-client.crt ]; then
            bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api --control-san-prefix sandbox-runner --world-readable &&
            chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls;
          fi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        env:
        - name: NUM_RUNNERS
          value: "1"
        volumeMounts:
        - name: sandbox-tls
          mountPath: /tls
      containers:
      - name: api
        image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.7.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: grpc
          containerPort: 9090
        env:
        - name: SANDBOX_API_KEYS
          valueFrom:
            secretKeyRef:
              name: n8n-sandbox-credentials
              key: api-key
        - name: SANDBOX_API_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-sandbox-credentials
              key: runner-registration-token
        - name: SANDBOX_API_RUNNER_API_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-sandbox-credentials
              key: runner-api-key
        - name: SANDBOX_API_GRPC_TLS_CERT_FILE
          value: /tls/api/grpc-server.crt
        - name: SANDBOX_API_GRPC_TLS_KEY_FILE
          value: /tls/api/grpc-server.key
        - name: SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE
          value: /tls/api/ca.crt
        - name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE
          value: /tls/api/ca.crt
        - name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE
          value: /tls/api/control-grpc-api-client.crt
        - name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE
          value: /tls/api/control-grpc-api-client.key
        - name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME
          value: sandbox-runner-1
        volumeMounts:
        - name: sandbox-tls
          mountPath: /tls
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
      volumes:
      - name: sandbox-tls
        persistentVolumeClaim:
          claimName: sandbox-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-runner-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-runner-1
  template:
    metadata:
      labels:
        app: sandbox-runner-1
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: sandbox-api
            topologyKey: kubernetes.io/hostname
      initContainers:
      - name: wait-for-mtls
        image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.7.0
        imagePullPolicy: IfNotPresent
        command: [sh, -c]
        args:
        - >-
          until [ -s /tls/runner/ca.crt ] &&
          [ -s /tls/runner/grpc-client.crt ] &&
          [ -s /tls/runner/control-grpc-server.crt ]; do sleep 2; done
        volumeMounts:
        - name: sandbox-tls
          mountPath: /tls
          readOnly: true
      containers:
      - name: runner
        image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:1.7.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        ports:
        - name: http
          containerPort: 8080
        - name: control-grpc
          containerPort: 9091
        env:
        - name: SANDBOX_API_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-sandbox-credentials
              key: runner-registration-token
        - name: SANDBOX_API_RUNNER_API_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-sandbox-credentials
              key: runner-api-key
        - name: SANDBOX_RUNNER_API_GRPC_ADDR
          value: sandbox-api:9090
        - name: SANDBOX_RUNNER_HTTP_BASE_URL
          value: https://sandbox-runner-1:8080
        - name: SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR
          value: :9091
        - name: SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR
          value: sandbox-runner-1:9091
        - name: SANDBOX_RUNNER_ID
          value: runner-1
        - name: SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE
          value: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.7.0
        - name: SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE
          value: /tls/runner/ca.crt
        - name: SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE
          value: /tls/runner/grpc-client.crt
        - name: SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE
          value: /tls/runner/grpc-client.key
        - name: SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME
          value: sandbox-api
        - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE
          value: /tls/runner/control-grpc-server.crt
        - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE
          value: /tls/runner/control-grpc-server.key
        - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE
          value: /tls/runner/ca.crt
        volumeMounts:
        - name: sandbox-tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: sandbox-tls
        persistentVolumeClaim:
          claimName: sandbox-tls