apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-27b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen38-27b
  template:
    metadata:
      labels:
        app: qwen38-27b
    spec:
      nodeSelector:
        kubernetes.io/hostname: mlops-node-4.lan
        hardware.gpu: amd
      tolerations:
      - key: dedicated
        operator: Equal
        value: qwen38-27b
        effect: NoSchedule
      containers:
      - name: vllm
        image: vllm/vllm-openai-rocm:v0.29.0
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -lc
        args:
        - python -m pip install --no-deps --no-build-isolation vllm-gguf-plugin gguf && exec vllm serve "$@"
        - --
        - DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF:Q4_K_M
        - --tokenizer
        - Qwen/Qwen3.8-27B
        - --hf-config-path
        - Qwen/Qwen3.8-27B
        - --served-model-name
        - Qwen3.8-27B
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        - --dtype
        - float16
        - --max-model-len
        - "32768"
        - --max-num-batched-tokens
        - "2096"
        - --max-num-seqs
        - "1"
        - --gpu-memory-utilization
        - "0.9"
        - --enable-chunked-prefill
        - --reasoning-parser
        - qwen3
        - --enable-auto-tool-choice
        - --tool-call-parser
        - qwen3_coder
        env:
        - name: HF_HOME
          value: /models/huggingface
        - name: VLLM_LOGGING_LEVEL
          value: DEBUG
        - name: VLLM_DISABLED_KERNELS
          value: RDNAHybridW4A16LinearKernel
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
          limits:
            cpu: "24"
            memory: 64Gi
            amd.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: Unconfined
        volumeMounts:
        - name: models
          mountPath: /models
        - name: shm
          mountPath: /dev/shm
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 360
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: qwen38-27b-model
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
