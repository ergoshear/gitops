apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
namePrefix: hermes-

resources:
- ../base
- home.yaml

patches:
- target:
    kind: Deployment
    name: fedora-44-deployment
  patch: |-
    - op: remove
      path: /spec/template/spec/containers/0/ports
    - op: add
      path: /spec/template/spec/containers/0/ports
      value:
      - name: dashboard
        containerPort: 9119
        protocol: TCP
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
      - name: HERMES_DASHBOARD
        value: "1"
      - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        valueFrom:
          secretKeyRef:
            name: hermes-dashboard-auth
            key: username
      - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: hermes-dashboard-auth
            key: password
      - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
        valueFrom:
          secretKeyRef:
            name: hermes-dashboard-auth
            key: session-secret
    - op: add
      path: /spec/template/spec/containers/0/startupProbe
      value:
        httpGet:
          path: /api/status
          port: dashboard
        periodSeconds: 10
        failureThreshold: 60
    - op: add
      path: /spec/template/spec/containers/0/readinessProbe
      value:
        httpGet:
          path: /api/status
          port: dashboard
        periodSeconds: 10
    - op: add
      path: /spec/template/spec/containers/0/livenessProbe
      value:
        httpGet:
          path: /api/status
          port: dashboard
        periodSeconds: 20
        failureThreshold: 3
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts
      value:
      - name: home
        mountPath: /opt/data
    - op: add
      path: /spec/template/spec/volumes
      value:
      - name: home
        persistentVolumeClaim:
          claimName: home
- target:
    kind: Service
    name: fedora-44-service
  patch: |-
    - op: replace
      path: /spec/ports
      value:
      - name: dashboard
        port: 9119
        protocol: TCP
        targetPort: dashboard

commonLabels:
  agent: hermes

images:
- name: ghcr.io/ergoshear/agent
  newName: ghcr.io/ergoshear/hermes-agent
  newTag: "371a8b9"