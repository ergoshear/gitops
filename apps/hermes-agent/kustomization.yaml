apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
namePrefix: hermes-

resources:
- ../base

patches:
- target:
    kind: Deployment
    name: fedora-44-deployment
  patch: |-
    - op: remove
      path: /spec/template/spec/containers/0/ports
- target:
    kind: Service
    name: fedora-44-service
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: fedora-44-service

commonLabels:
  agent: hermes

images:
- name: ghcr.io/ergoshear/agent
  newName: ghcr.io/ergoshear/hermes-agent
  newTag: aebc305