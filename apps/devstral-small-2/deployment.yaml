apiVersion: apps/v1
kind: Deployment
metadata:
  name: devstral-small-2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devstral-small-2
  template:
    metadata:
      labels:
        app: devstral-small-2
    spec:
      nodeSelector:
        kubernetes.io/hostname: mlops-node-4.lan
        hardware.gpu: amd
      initContainers:
      - name: download-model
        image: ghcr.io/ergoshear/devstral-small-2:latest
        imagePullPolicy: Always
        command:
        - /usr/local/bin/download-model
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: llama-server
        image: ghcr.io/ergoshear/devstral-small-2:latest
        imagePullPolicy: Always
        env:
        - name: CTX_SIZE
          value: "262144"
        - name: PARALLEL
          value: "1"
        - name: GPU_LAYERS
          value: "99"
        - name: KV_OFFLOAD
          value: "on"
        - name: BATCH_SIZE
          value: "128"
        - name: UBATCH_SIZE
          value: "64"
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: "8"
            memory: 24Gi
          limits:
            cpu: "24"
            memory: 56Gi
            amd.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: Unconfined
        volumeMounts:
        - name: models
          mountPath: /models
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 360
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: devstral-small-2-model
