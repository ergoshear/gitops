apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-hosts
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - hermes-agent.ergoshear.dev
    - n8n.ergoshear.dev
    - code.ergoshear.dev
    - crew.ergoshear.dev
    - olla.ergoshear.dev
    - herd.ergoshear.dev
    secretName: ergoshear-dev-tls
  rules:
  - host: hermes-agent.ergoshear.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-dashboard
            port:
              number: 9119
  - host: n8n.ergoshear.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: n8n-fedora-44-service
            port:
              number: 80
  - host: code.ergoshear.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vscode-service
            port:
              number: 80
  - host: crew.ergoshear.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: crewai
            port:
              number: 8000
  - host: olla.ergoshear.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: olla
            port:
              number: 40114
  - host: herd.ergoshear.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ollama-herd
            port:
              number: 11435
